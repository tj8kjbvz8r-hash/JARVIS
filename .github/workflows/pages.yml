name: Deploy JARVIS to GitHub Pages
on:
  push:
    branches: [claude/ipad-jarvis-vite-react-t7usab, main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: jarvis
      - run: npm run build
        working-directory: jarvis
      - uses: actions/upload-pages-artifact@v3
        with:
          path: jarvis/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
